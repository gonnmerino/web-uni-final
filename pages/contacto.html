<body>
    <video autoplay muted loop playsinline class="bg">
        <source src="../assets/video/video-bg-2.webm" type="video/webm">
    </video>
    <div class="container">
        <header class="header">
            <nav class="nav-container">
                <a class="nav-items" href="../index.html">INICIO</a>
                <a class="nav-items" href="sobre-interestelar.html">SOBRE INTERSTELLAR</a>

                <a class="nav-items" href="curiosidades-premios.html">CURIOSIDADES Y PREMIOS</a>
                <a class="nav-items" href="reparto.html">REPARTO</a>
                <a class="nav-items button-selected" href="contacto.html">CONTACTO</a>
            </nav>
            <div class="menu-mobile-container">
                <input type="checkbox" id="toggle-menu" class="menu-toggle" />
                <label class="menu-mobile" for="toggle-menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
                <aside class="sidebar">
                    <a class="nav-items" href="../index.html">INICIO</a>
                    <a class="nav-items" href="sobre-interestelar.html">SOBRE INTERSTELLAR</a>
                    <a class="nav-items" href="produccion-estudio.html">PRODUCCION Y ESTUDIO</a>

                </aside>

        </header>
        <div class="titles">
            <h2>Dirigida por<br>Cristopher Nolan</h2>
            <h1>INTERESTELAR</h1>
        </div>
        <div class="form-container">
            <form class="contact-form" action="confirmacion-formulario.html" method="GET">
                <h2 class="form-title">¡Envianos un mensaje!</h2>
                <div class="form">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" required>
                </div>
                <div class="form">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Enviar</button>
            </form>
        </div>
